name: Deploy to Production

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure authenticated SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable full-stack revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          RELEASE_SHA="$2"
          cd "$DEPLOY_PATH"

          test -f .env
          PREVIOUS_SHA="$(git rev-parse HEAD)"
          git fetch --prune origin
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git checkout --detach "$RELEASE_SHA"
          python scripts/verify_release_clean.py

          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          $COMPOSE config --quiet
          $COMPOSE build backend worker-high worker-default worker-low frontend
          $COMPOSE up -d postgres redis minio pgbouncer
          $COMPOSE run --rm backend alembic upgrade head
          $COMPOSE up -d backend worker-high worker-default worker-low frontend tempo postgres-exporter node-exporter prometheus grafana flower nginx

          if ! curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/api/ready; then
            git checkout --detach "$PREVIOUS_SHA"
            $COMPOSE build backend worker-high worker-default worker-low frontend
            $COMPOSE up -d backend worker-high worker-default worker-low frontend
            exit 1
          fi
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused https://app.procureflow.com/api/ready
          printf '%s\n' "$RELEASE_SHA" > .deployed-revision
          REMOTE
