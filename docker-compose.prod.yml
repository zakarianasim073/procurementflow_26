services:
  nginx:
    image: nginx:1.27.5-alpine
    container_name: procurementflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/procureflow.http.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks:
      - procurementflow-net

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: procurementflow-certbot
    profiles: ["ssl"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: procurementflow-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - procurementflow-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: procurementflow-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - procurementflow-net

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["migration"]
    restart: "no"
    command: alembic upgrade head
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PGBOUNCER_URL: ""
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - procurementflow-net

networks:
  procurementflow-net:
    driver: bridge

volumes:
  certbot_www:
  letsencrypt:
  prometheus_data:
  grafana_data:
