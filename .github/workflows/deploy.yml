name: Deploy immutable production revision

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full commit SHA that passed Continuous Integration"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable application revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "${#RELEASE_SHA}" -eq 40
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          app_path=/opt/procureflow/app
          env_file=/opt/procureflow/secrets/.env.production
          cd "$app_path"

          test -f "$env_file"
          previous_sha="$(git rev-parse HEAD)"
          git fetch --prune origin codex/procureflow-enterprise
          git cat-file -e "${release_sha}^{commit}"
          git checkout --detach "$release_sha"
          python3 scripts/verify_release_clean.py

          compose="sudo docker compose --env-file $env_file -f docker-compose.yml -f docker-compose.prod.yml"
          $compose config --quiet
          $compose build backend worker-high worker-default worker-low frontend
          $compose up -d postgres redis minio minio-init pgbouncer
          $compose up -d backend worker-high worker-default worker-low frontend nginx

          if ! curl --fail --retry 18 --retry-delay 5 --retry-connrefused \
              -H 'Host: api.procureflowbd.com' http://127.0.0.1/api/ready; then
            git checkout --detach "$previous_sha"
            $compose build backend worker-high worker-default worker-low frontend
            $compose up -d backend worker-high worker-default worker-low frontend nginx
            exit 1
          fi

          printf '%s\n' "$release_sha" > /opt/procureflow/releases/current
          REMOTE

      - name: Verify public API after DNS and TLS activation
        if: ${{ vars.PRODUCTION_TLS_ACTIVE == 'true' }}
        run: curl --fail --retry 12 --retry-delay 5 https://api.procureflowbd.com/api/ready
