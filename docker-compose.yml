version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Container-internal URLs override any .env values (host-port variants would fail inside compose)
      # DATABASE_URL stays direct (:5432) — used by Alembic/migrations and as
      # the async-engine fallback. PGBOUNCER_URL routes the async engine
      # (API request path) through the pooler; transaction-mode PgBouncer
      # cannot safely carry DDL (T-011/DB-03).
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - procurementflow-net

  # ── Celery workers (WRK-01 / T-012): one queue per service ───────────────
  # Each worker consumes exactly one priority queue so a saturated `low`
  # (report) queue can never delay `high` (alerts/radar) tasks.
  worker-high:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-worker-high
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q high
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - procurementflow-net

  worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-worker-default
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q default
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    networks:
      - procurementflow-net

  worker-low:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-worker-low
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q low
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - procurementflow-net

  frontend:
    build:
      context: ./frontend_v2
      dockerfile: Dockerfile
    container_name: procurementflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks:
      - procurementflow-net

  postgres:
    image: postgres:17-alpine
    container_name: procurementflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-procureflow_bd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      # Host port 5433 matches local-dev convention (avoids collision with any host-side PG)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procureflow_bd"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - procurementflow-net

  pgbouncer:
    image: edoburu/pgbouncer:1.24.1
    container_name: procurementflow-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-procureflow_bd}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 10
      ADMIN_USERS: postgres
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks:
      - procurementflow-net

  redis:
    image: redis:7-alpine
    container_name: procurementflow-redis
    restart: unless-stopped
    # --appendonly yes enables AOF persistence — Celery queue survives container restarts
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - procurementflow-net

  minio:
    image: minio/minio:latest
    container_name: procurementflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    networks:
      - procurementflow-net

  flower:
    image: mher/flower:latest
    container_name: procurementflow-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    depends_on:
      - redis
    healthcheck:
      # mher/flower is Python-based; python is always present even without curl
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    networks:
      - procurementflow-net

  # ── Monitoring Stack (T-017/OBS-01): traces, metrics, dashboards, alerts ──
  tempo:
    image: grafana/tempo:latest
    container_name: procurementflow-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    volumes:
      - tempo_data:/var/tempo
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/status"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - procurementflow-net

  prometheus:
    image: prom/prometheus:latest
    container_name: procurementflow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - postgres-exporter
      - node-exporter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - procurementflow-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: procurementflow-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    networks:
      - procurementflow-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: procurementflow-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    networks:
      - procurementflow-net

  grafana:
    image: grafana/grafana:latest
    container_name: procurementflow-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_SERVER_ROOT_URL=http://grafana:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - procurementflow-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  procurementflow-net:
    driver: bridge
