[alembic]
script_location = alembic
prepend_sys_path = .
# Read-only compatibility path for databases already carrying legacy revisions.
# Production and CI must override this placeholder with DATABASE_URL.
sqlalchemy.url = postgresql+psycopg2://postgres:CHANGE_ME@localhost:5433/procureflow_bd

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
