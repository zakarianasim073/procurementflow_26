[pytest]
asyncio_mode = auto
timeout = 120
timeout_method = thread
testpaths =
    tests
    app/agents/test_agents.py
python_files = test_*.py
markers =
    golden: golden-file regression tests (SOR/BOQ expected outputs)
    slow: tests that take > 5 seconds
filterwarnings =
    ignore::DeprecationWarning:app.db.models
    ignore::DeprecationWarning:app.services.intelligence_data_service
