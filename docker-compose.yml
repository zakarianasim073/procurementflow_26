services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-backend
    restart: unless-stopped
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      # Container-internal URLs override any .env values (host-port variants would fail inside compose)
      # DATABASE_URL stays direct (:5432) — used by Alembic/migrations and as
      # the async-engine fallback. PGBOUNCER_URL routes the async engine
      # (API request path) through the pooler; transaction-mode PgBouncer
      # cannot safely carry DDL (T-011/DB-03).
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-procurementflow-tenders}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - ENVIRONMENT=production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-3}
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/workspace/backend/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - procurementflow-net

  # ── Celery workers (WRK-01 / T-012): one queue per service ───────────────
  # Each worker consumes exactly one priority queue so a saturated `low`
  # (report) queue can never delay `high` (alerts/radar) tasks.
  worker-high:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-worker-high
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 -Q high
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-procurementflow-tenders}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/workspace/backend/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - procurementflow-net

  worker-default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-worker-default
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=3 -Q default
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-procurementflow-tenders}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/workspace/backend/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    networks:
      - procurementflow-net

  worker-low:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurementflow-worker-low
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q low
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env}
        required: true
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PGBOUNCER_URL=${PGBOUNCER_URL:?PGBOUNCER_URL is required}
      - REDIS_URL=${REDIS_URL:?REDIS_URL is required}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-procurementflow-tenders}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - ENVIRONMENT=production
    volumes:
      - backend_data:/data
      - ./backend/app/sor:/workspace/backend/app/sor
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - procurementflow-net

  frontend:
    build:
      context: ./frontend_v2
      dockerfile: Dockerfile
    container_name: procurementflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks:
      - procurementflow-net

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: procurementflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-procureflow_bd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procureflow_bd"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    networks:
      - procurementflow-net

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: procurementflow-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:-procureflow_bd}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 20
      RESERVE_POOL_SIZE: 10
      ADMIN_USERS: postgres
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    networks:
      - procurementflow-net

  redis:
    image: redis:7.4.5-alpine
    container_name: procurementflow-redis
    restart: unless-stopped
    # --appendonly yes enables AOF persistence — Celery queue survives container restarts
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - procurementflow-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: procurementflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - procurementflow-net

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" >/dev/null &&
        mc anonymous set none "local/$$MINIO_BUCKET" >/dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-procurementflow-tenders}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - procurementflow-net

  flower:
    image: mher/flower:2.0.1
    container_name: procurementflow-flower
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=${REDIS_URL:?REDIS_URL is required}
      - FLOWER_PORT=5555
    profiles: ["observability"]
    depends_on:
      - redis
    healthcheck:
      # mher/flower is Python-based; python is always present even without curl
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    networks:
      - procurementflow-net

  # ── Monitoring Stack (T-017/OBS-01): traces, metrics, dashboards, alerts ──
  tempo:
    image: grafana/tempo:2.6.1
    container_name: procurementflow-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo.yaml
    volumes:
      - tempo_data:/var/tempo
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
    profiles: ["observability"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/status"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - procurementflow-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: procurementflow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    profiles: ["observability"]
    depends_on:
      - backend
      - postgres-exporter
      - node-exporter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - procurementflow-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: procurementflow-postgres-exporter
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    networks:
      - procurementflow-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: procurementflow-node-exporter
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    networks:
      - procurementflow-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: procurementflow-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_SERVER_ROOT_URL=http://grafana:3000
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    networks:
      - procurementflow-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  procurementflow-net:
    driver: bridge
